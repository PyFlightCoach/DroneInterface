[project]
name = "droneinterface"
version="0.1.0"
authors = [{name = "Thomas David", email = "thomasdavid0@gmail.com"}]
description = "A tidy way to talk to a Drone through PyMavLink"
readme = "readme.md"
requires-python = ">=3.12"
license = {text = "GNU GPL v3"}
classifiers = ["Programming Language :: Python :: 3",]
dependencies = [
    "numpy>=2.1.3",
    "pandas>=2.2.3",
    "pymavlink",
    "flightdata",

]

[tool.hatch.build.targets.wheel]
packages = ["droneinterface"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.setuptools_scm]